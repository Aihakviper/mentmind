<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MentMinds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --bg-card: #334155;
            --border: #475569;
            --text-light: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .header {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #8b5cf6, var(--primary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .reset-card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon-wrapper {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        h1 {
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .description {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            padding-left: 3rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.75rem;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.9rem;
            cursor: pointer;
            color: var(--text-light);
            user-select: none;
        }

        .password-toggle:hover {
            color: white;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: var(--error);
        }

        .password-strength-bar.medium {
            width: 66%;
            background: var(--warning);
        }

        .password-strength-bar.strong {
            width: 100%;
            background: var(--success);
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .requirements {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .requirements li {
            padding: 0.25rem 0;
            color: var(--text-light);
        }

        .requirements li.met {
            color: var(--success);
        }

        .requirements li::before {
            content: '○ ';
            margin-right: 0.5rem;
        }

        .requirements li.met::before {
            content: '✓ ';
        }

        .btn {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group.error input {
            border-color: var(--error);
        }

        .form-group.success input {
            border-color: var(--success);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">
            <div class="logo-icon">🎓</div>
            <span>MentMinds</span>
        </a>
    </div>

    <div class="container">
        <div class="reset-card">
            <div class="icon-wrapper">
                <div class="icon">🔑</div>
            </div>

            <h1>Reset Password</h1>
            <p class="description">
                Create a new strong password for your account.
            </p>

            <div class="alert alert-success" id="successAlert">
                ✓ Password reset successful! Redirecting to login...
            </div>

            <div class="alert alert-error" id="errorAlert">
                <span id="errorMessage"></span>
            </div>

            <form id="resetPasswordForm">
                <div class="requirements">
                    <strong>Password Requirements:</strong>
                    <ul id="requirementsList">
                        <li id="req-length">At least 8 characters</li>
                        <li id="req-uppercase">One uppercase letter</li>
                        <li id="req-lowercase">One lowercase letter</li>
                        <li id="req-number">One number</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="password">New Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Enter new password" required>
                    <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrength"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">Use 8+ characters with letters, numbers</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                    <span class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</span>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="spinner"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        
        // ── API URL helper ──────────────────────────────────────────────
        // Always points to FastAPI at localhost:8000
        // Open this file via Live Server (port 5500), NOT via file://
        const API_URL = 'https://mentmind.onrender.com/api';
        // ────────────────────────────────────────────────────────────────
        const form = document.getElementById('resetPasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHint = document.getElementById('passwordHint');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check if token exists
        if (!token) {
            showError('Invalid reset link. Please request a new password reset.');
            submitBtn.disabled = true;
        }

        // Password strength checker
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            checkPasswordStrength(password);
            checkRequirements(password);
        });

        function checkPasswordStrength(password) {
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;

            passwordStrength.className = 'password-strength-bar';
            if (strength <= 2) {
                passwordStrength.classList.add('weak');
                passwordHint.textContent = 'Weak password - add more characters';
                passwordHint.style.color = 'var(--error)';
            } else if (strength <= 4) {
                passwordStrength.classList.add('medium');
                passwordHint.textContent = 'Good password - consider adding symbols';
                passwordHint.style.color = 'var(--warning)';
            } else {
                passwordStrength.classList.add('strong');
                passwordHint.textContent = 'Strong password! ✓';
                passwordHint.style.color = 'var(--success)';
            }
        }

        function checkRequirements(password) {
            const requirements = {
                'req-length': password.length >= 8,
                'req-uppercase': /[A-Z]/.test(password),
                'req-lowercase': /[a-z]/.test(password),
                'req-number': /\d/.test(password)
            };

            for (const [id, met] of Object.entries(requirements)) {
                const elem = document.getElementById(id);
                if (met) {
                    elem.classList.add('met');
                } else {
                    elem.classList.remove('met');
                }
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (password.length < 8) {
                showError('Password must be at least 8 characters long');
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showError('Password must contain at least one uppercase letter');
                return;
            }

            if (!/[a-z]/.test(password)) {
                showError('Password must contain at least one lowercase letter');
                return;
            }

            if (!/\d/.test(password)) {
                showError('Password must contain at least one number');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError(data.detail || 'Failed to reset password. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('An error occurred. Please try again later.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        function showSuccess() {
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
        }

        function hideAlerts() {
            successAlert.classList.remove('show');
            errorAlert.classList.remove('show');
        }
    </script>
</body>
</html>
