<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MentMinds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --success: #10b981;
            --error: #ef4444;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --bg-card: #334155;
            --border: #475569;
            --accent: #8b5cf6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Header */
        .header {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .header-link {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .header-link:hover {
            color: white;
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 2rem;
        }

        .welcome-text h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text p {
            color: var(--text-light);
            font-size: 1rem;
        }

        /* Form */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            padding-left: 3rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.75rem;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.9rem;
            cursor: pointer;
            color: var(--text-light);
            user-select: none;
        }

        .password-toggle:hover {
            color: white;
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-light);
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Social Login */
        .social-login {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            padding: 0.875rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Signup Link */
        .signup-link {
            text-align: center;
            color: var(--text-light);
            margin-top: 2rem;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }

        /* Footer */
        .footer {
            padding: 2rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .footer a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: white;
        }

        /* Field Validation */
        .form-group.error input {
            border-color: var(--error);
        }

        .form-group.success input {
            border-color: var(--success);
        }

        .field-error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .field-error {
            display: block;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .login-card {
                padding: 2rem;
            }

            .welcome-text h1 {
                font-size: 1.75rem;
            }

            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="/" class="logo">
            <div class="logo-icon">🎓</div>
            <span>MentMinds</span>
        </a>
        <a href="register_enhanced.html" class="header-link">Don't have an account?</a>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="login-card">
            <div class="welcome-text">
                <h1>Welcome Back! 👋</h1>
                <p>Login to continue your journey</p>
            </div>

            <!-- Alert Messages -->
            <div class="alert alert-error" id="errorAlert">
                <span>⚠️</span>
                <span id="errorMessage"></span>
            </div>

            <div class="alert alert-success" id="successAlert">
                <span>✓</span>
                <span id="successMessage"></span>
            </div>

            <div class="alert alert-warning" id="warningAlert">
                <span>ℹ️</span>
                <span id="warningMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" placeholder="your-email@example.com" required autocomplete="email">
                    <div class="field-error">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                    <div class="field-error">Please enter your password</div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-login">
                <button class="social-btn" onclick="socialLogin('google')">
                    <span>🔍</span>
                    <span>Google</span>
                </button>
                <button class="social-btn" onclick="socialLogin('linkedin')">
                    <span>💼</span>
                    <span>LinkedIn</span>
                </button>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="register_enhanced.html">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">Terms of Service</a>
        <span>•</span>
        <a href="#">Privacy Policy</a>
    </div>

    <script>
        // Configuration
        
        // ── API URL helper ──────────────────────────────────────────────
        // Always points to FastAPI at localhost:8000
        // Open this file via Live Server (port 5500), NOT via file://
        const API_URL = 'http://localhost:8000/api';
        // ────────────────────────────────────────────────────────────────

        // Elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const warningAlert = document.getElementById('warningAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const warningMessage = document.getElementById('warningMessage');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check for saved email
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMeCheckbox.checked = true;
            }

            // Check for success message from registration
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('verified') === 'true') {
                showSuccess('Email verified successfully! You can now login.');
            }
            if (urlParams.get('registered') === 'true') {
                showWarning('Please check your email to verify your account before logging in.');
            }

            // Setup form submission
            loginForm.addEventListener('submit', handleLogin);
        });

        function togglePassword() {
            const field = passwordInput;
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlerts();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Validation
            if (!validateEmail(email)) {
                showFieldError('email', 'Please enter a valid email');
                return;
            }

            if (!password) {
                showFieldError('password', 'Please enter your password');
                return;
            }

            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                // Save tokens
                localStorage.setItem('accessToken', data.tokens.access_token);
                localStorage.setItem('refreshToken', data.tokens.refresh_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                

                // Remember email if checked
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                // 1. Save essential info
            

                // 2. Redirect based on role
                localStorage.setItem(
                    'activeDashboard',
                    data.user.role.toLowerCase() === 'mentor' ? 'mentor' : 'mentee'
                );

                // Check if email is verified
                if (!data.is_verified) {
                    showWarning('Please verify your email before accessing all features.');
                    setTimeout(() => {
                        if (data.user.role.toLowerCase() === 'mentor') {
                    window.location.href = 'mentor_dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
                    }, 2000);
                    return;
                }

                // Success - redirect to dashboard
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    if (data.user.role.toLowerCase() === 'mentor') {
                    window.location.href = 'mentor_dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
                    
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showError(error.message);
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        function validateEmail(email) {
            const emailGroup = emailInput.closest('.form-group');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailRegex.test(email)) {
                emailGroup.classList.remove('error');
                emailGroup.classList.add('success');
                return true;
            } else {
                emailGroup.classList.remove('success');
                emailGroup.classList.add('error');
                return false;
            }
        }

        function showFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const group = field.closest('.form-group');
            group.classList.add('error');
            group.classList.remove('success');
        }

        function socialLogin(provider) {
            showWarning(`${provider} login coming soon!`);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
            warningAlert.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
            warningAlert.classList.remove('show');
        }

        function showWarning(message) {
            warningMessage.textContent = message;
            warningAlert.classList.add('show');
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
        }

        function hideAlerts() {
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
            warningAlert.classList.remove('show');
        }
    </script>
</body>
</html>
